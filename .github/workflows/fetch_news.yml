name: Fetch ESPN NFL News

on:
  schedule:
    # UTC times -- adjust to your timezone. Runs 4x/day: ~7am, 12pm, 4pm, 8pm Eastern
    # (11:00, 16:00, 20:00, 00:00 UTC during EDT). Cron syntax: minute hour day month weekday
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from GitHub's Actions tab, for testing

permissions:
  contents: write  # needed for this workflow to commit the CSV back into the repo

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests google-auth google-api-python-client

      - name: Run news fetch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python fetch_espn_news_scheduled.py

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espn_news.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ESPN news data"
          git push
